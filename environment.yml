# Notebook environment (conda option).
# Conda installs Python and pip. The packages come from pip, with the same versions as requirements.txt.
name: dt_mining
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.3.5
      - pandas==2.3.3
      - scipy==1.16.3
      - matplotlib==3.10.0
      - seaborn==0.13.2
      - jupyter==1.1.1
      - notebook==7.6.3
      - ipykernel==7.4.0
